<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elif & Umut | Sesli Mesaj</title>
<style>
:root{--wine:#7b2338;--cream:#fffaf7;--ink:#35282a}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#fffaf7,#f4e7e4);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}main{width:min(100%,460px);background:#fff;border-radius:24px;padding:28px 22px;box-shadow:0 12px 45px #4b1a2514;text-align:center}h1{font-family:Georgia,serif;font-weight:500;color:var(--wine);margin:8px 0}p{line-height:1.55;color:#6d5a5d}.heart{font-size:30px;color:var(--wine)}input{width:100%;padding:13px;border:1px solid #e4d3d5;border-radius:12px;font:inherit;margin:12px 0}button{width:100%;border:0;border-radius:12px;padding:14px 16px;margin:7px 0;background:var(--wine);color:white;font-size:16px;font-weight:650}button:disabled{opacity:.45}button.secondary{background:#f2e7e8;color:var(--wine)}#status{min-height:48px;margin-top:12px;font-size:14px;white-space:pre-wrap}.small{font-size:12px;color:#8b7b7d}
</style></head>
<body><main><div class="heart">♥</div><h1>Elif & Umut</h1><p>Bizim için bir sesli anı bırakır mısın?<br>Güzel dileklerini kaydedebilirsin.</p><input id="guest" maxlength="60" placeholder="Adın (isteğe bağlı)"><button id="start">🎙️ Kaydı başlat</button><button id="stop" class="secondary" disabled>Kaydı bitir</button><button id="send" disabled>Sesli mesajı gönder</button><div id="status" role="status">Kayda başlamak için düğmeye bas.</div><p class="small">Mikrofon izni istenirse İzin ver'i seç. Kayıt en fazla 60 saniyedir.</p></main>
<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbwpvrD5DMMnnXndKLDk_-qLFfzIENCufFWYqkpSIS1tdN9VkqnW_Br6biQBzFgAbKHejA/exec';
const startBtn=document.querySelector('#start'),stopBtn=document.querySelector('#stop'),sendBtn=document.querySelector('#send'),statusEl=document.querySelector('#status');let stream,recorder,chunks=[],recordedBlob;
function status(t){statusEl.textContent=t}
startBtn.onclick=async()=>{try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('Bu tarayıcı mikrofon kaydını desteklemiyor. Sayfayı Chrome ile aç ve HTTPS kullandığından emin ol.');stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{recordedBlob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});sendBtn.disabled=!recordedBlob.size;status('Kayıt hazır. Dinlemek istersen göndermeden önce tekrar kayıt alabilirsin.');stream.getTracks().forEach(t=>t.stop())};recorder.start();startBtn.disabled=true;stopBtn.disabled=false;sendBtn.disabled=true;status('Kayıt yapılıyor… Bitirmek için “Kaydı bitir” düğmesine bas.');setTimeout(()=>{if(recorder?.state==='recording')recorder.stop();startBtn.disabled=false;stopBtn.disabled=true;},60000)}catch(e){status('Mikrofon açılamadı: '+(e.message||e)+'\nChrome adres çubuğundaki site izinlerinden mikrofonu etkinleştir.')}};
stopBtn.onclick=()=>{if(recorder?.state==='recording')recorder.stop();startBtn.disabled=false;stopBtn.disabled=true};
sendBtn.onclick=async()=>{if(!recordedBlob)return;if(SCRIPT_URL.includes('PASTE_APPS')){status('Kurulum eksik: Apps Script bağlantısı henüz dosyaya eklenmemiş.');return}sendBtn.disabled=true;status('Sesli mesaj gönderiliyor…');try{const reader=new FileReader();const base64=await new Promise((resolve,reject)=>{reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(recordedBlob)});const payload={action:'uploadAudio',base64,fileName:'sesli-mesaj-'+Date.now()+'.webm',mimeType:recordedBlob.type||'audio/webm',guestName:document.querySelector('#guest').value.trim()};await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});status('Gönderim isteği iletildi. Kayıt Drive’a ulaştı mı diye Apps Script/Drive tarafında test edeceğiz.');recordedBlob=null;sendBtn.disabled=true}catch(e){status('Gönderilemedi: '+(e.message||e));sendBtn.disabled=false}};
</script></body></html>
